<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9ef">
<title>CaféConFé</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff9ef;--bg2:#fdf0d5;--card:#ffffff;--txt:#3b2f2f;--mut:#7a6a5d;--pri:#c98a1b;--pri2:#e5a93a;--acc:#3b82c4;--onpri:#ffffff;--line:rgba(90,60,20,.14);--line2:rgba(90,60,20,.3);--danger:#d64545;--ok:#2e9e62;--r:20px;--fd:'Playfair Display',Georgia,serif;--fb:'Nunito',system-ui,sans-serif;--sh:0 10px 30px rgba(90,60,20,.12)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--txt);line-height:1.5;min-height:100dvh;padding-bottom:calc(76px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:var(--acc)}
h1,h2,h3{font-family:var(--fd);line-height:1.2}
[hidden]{display:none!important}
.mut{color:var(--mut)}
/* fondos */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body.f-rayos::before{background:conic-gradient(from 200deg at 50% -10%,transparent 0 8%,color-mix(in srgb,var(--pri2) 18%,transparent) 10% 14%,transparent 16% 24%,color-mix(in srgb,var(--pri2) 14%,transparent) 26% 30%,transparent 32% 42%,color-mix(in srgb,var(--pri2) 16%,transparent) 44% 47%,transparent 49%);animation:ray 14s ease-in-out infinite alternate}
@keyframes ray{from{transform:rotate(-3deg) scale(1.1)}to{transform:rotate(3deg) scale(1.2)}}
body.f-nubes::before{background:radial-gradient(60px 30px at 15% 12%,color-mix(in srgb,var(--card) 90%,transparent),transparent),radial-gradient(90px 40px at 70% 22%,color-mix(in srgb,var(--card) 85%,transparent),transparent),radial-gradient(70px 34px at 40% 48%,color-mix(in srgb,var(--card) 70%,transparent),transparent),radial-gradient(100px 44px at 85% 70%,color-mix(in srgb,var(--card) 80%,transparent),transparent);background-size:140% 100%;animation:cloud 60s linear infinite}
@keyframes cloud{to{background-position:-140% 0}}
body.f-estrellas::before{background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 80px,#ffe9a8,transparent),radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 230px 120px,#cfe0ff,transparent),radial-gradient(2px 2px at 50px 150px,#fff,transparent);background-size:260px 180px;animation:twk 5s ease-in-out infinite alternate;opacity:.6}
@keyframes twk{to{opacity:.25}}
body.f-cruces::before{background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:46px 46px;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 70%);opacity:.5}
/* cabecera */
.hd{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.brand svg,.brand img{width:44px;height:44px;flex:none;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.15))}
.brand b{font-family:var(--fd);font-size:1.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,var(--pri),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--mut);font-size:.72rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-u{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.85rem}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--bg2);display:grid;place-items:center;font-weight:800;color:var(--pri);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.wrap{max-width:900px;margin:0 auto;padding:16px}
/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;background:var(--card);border:2px solid var(--line2);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri2),var(--pri));color:var(--onpri);border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 35%,transparent)}
.btn.acc{background:var(--acc);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 13px;font-size:.85rem;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.fld{display:block;margin:10px 0}
.fld>span{display:block;font-weight:700;font-size:.85rem;margin-bottom:4px;color:var(--mut)}
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=color]):not([type=range]),select,textarea{width:100%;padding:11px 13px;border-radius:13px;border:2px solid var(--line);background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:90px;resize:vertical}
input[type=color]{width:100%;height:42px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:3px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:.92rem}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--pri);flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.fileb{position:relative;overflow:hidden;cursor:pointer}
.fileb input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}
/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:12px 0}
.hero{text-align:center;padding:34px 18px 26px;position:relative}
.hero h1{font-size:clamp(2rem,8vw,3.2rem);margin:6px 0}
.hero p{color:var(--mut);max-width:34em;margin:8px auto 18px;font-size:1.05rem}
.hero .cup{width:92px;height:92px;margin:0 auto;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.ver{text-align:center;padding:20px 18px;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--pri2) 18%,var(--card)),color-mix(in srgb,var(--acc) 12%,var(--card)));border:1px solid var(--line);margin:14px 0}
.ver q{font-family:var(--fd);font-size:1.2rem;font-style:italic;display:block;quotes:"“" "”"}
.ver cite{display:block;margin-top:8px;font-weight:800;color:var(--pri);font-style:normal}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.steps .card{margin:0;text-align:center}.steps .ic{font-size:2rem}
.legal{white-space:pre-line;background:var(--bg2);border-radius:14px;padding:12px 14px;max-height:40dvh;overflow:auto;font-size:.92rem}
/* personas */
.filters{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin:8px 0}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.people{grid-template-columns:repeat(3,1fr)}}@media(min-width:860px){.people{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--sh);text-align:left;cursor:pointer;position:relative}
.pc .ph{aspect-ratio:1;background:var(--bg2);display:grid;place-items:center;font-size:2.6rem;color:var(--pri);overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .inf{padding:9px 11px}.pc b{display:block;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc small{display:block;color:var(--mut);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{position:absolute;top:8px;right:8px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:color-mix(in srgb,var(--pri) 16%,transparent);color:var(--pri);margin:2px 3px 2px 0}
.tag.b{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;background:var(--bg2)}
.gal .gi{position:relative}.gal .gi button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem}
.big-av{width:130px;height:130px;border-radius:50%;margin:0 auto 8px;overflow:hidden;border:4px solid var(--pri);background:var(--bg2);display:grid;place-items:center;font-size:3rem;color:var(--pri)}
.big-av img{width:100%;height:100%;object-fit:cover}
/* listas */
.lst{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:8px 0;cursor:pointer;text-align:left;width:100%}
.lst .t{flex:1;min-width:0}.lst .t b{display:block}.lst .t small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .ic{font-size:1.7rem;width:44px;text-align:center}
.cn{background:var(--danger);color:#fff;border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:.75rem;font-weight:800;padding:0 6px}
/* navegación inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:8px 2px 7px;font-size:.7rem;font-weight:800;color:var(--mut);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs button i{font-style:normal;font-size:1.35rem}.tabs button.on{color:var(--pri)}
.tabs .cn{position:absolute;top:3px;left:55%}
/* modales */
.ov{position:fixed;inset:0;z-index:100;background:rgba(30,20,10,.55);display:grid;place-items:end center;animation:fi .2s}
@keyframes fi{from{opacity:0}}
.box{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));position:relative;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px)}}
.ov.full .box{max-width:900px;height:100dvh;max-height:100dvh;border-radius:0}
@media(min-width:700px){.ov{place-items:center}.box{border-radius:26px}.ov.full .box{height:94dvh;max-height:94dvh;border-radius:22px}}
.box h2{padding-right:44px;margin-bottom:6px}
.x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:var(--bg2);font-size:1.1rem;z-index:3}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:400;background:var(--txt);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--danger);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* chat */
.chat{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column}
.chat-h{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--card)}
.chat-h .t{flex:1;min-width:0;text-align:left}.chat-h .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-h .t small{color:var(--mut)}
.chat-h button.ib{width:40px;height:40px;border-radius:50%;background:var(--bg2);font-size:1.15rem;flex:none}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(var(--bg),var(--bg2))}
.m{max-width:82%;padding:8px 12px;border-radius:18px 18px 18px 5px;background:var(--card);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;position:relative}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--pri2),var(--pri));color:var(--onpri);border-radius:18px 18px 5px 18px;border-color:transparent}
.m.adm{align-self:center;max-width:92%;background:color-mix(in srgb,var(--acc) 16%,var(--card));border:1px dashed var(--acc);text-align:center}
.m .who{font-weight:800;font-size:.76rem;color:var(--pri);cursor:pointer;display:block}.m.me .who{display:none}
.m p{white-space:pre-wrap}.m time{display:block;font-size:.66rem;opacity:.65;text-align:right;margin-top:2px}
.m .pic{display:block;margin-top:5px;padding:7px 11px;border-radius:11px;background:rgba(0,0,0,.12);font-weight:700;font-size:.85rem}
.m img.full{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-top:5px}
.m .rep{position:absolute;top:2px;right:6px;font-size:.7rem;opacity:.0}.m:hover .rep,.m:focus-within .rep{opacity:.7}
.inbar{display:flex;gap:8px;align-items:flex-end;padding:9px 10px;padding-bottom:calc(9px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.inbar textarea{min-height:44px;max-height:120px;height:44px;resize:none;padding:10px 13px;border-radius:22px}
.inbar .ib{width:44px;height:44px;border-radius:50%;background:var(--bg2);font-size:1.2rem;flex:none}
.inbar .send{background:linear-gradient(135deg,var(--pri2),var(--pri));color:var(--onpri)}
.emo{display:flex;flex-wrap:wrap;gap:2px;padding:6px 10px;background:var(--card);border-top:1px solid var(--line)}.emo button{width:38px;height:38px;font-size:1.3rem;border-radius:10px}
/* panel admin */
.adm-nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none;margin-right:-4px}
.adm-nav button{flex:none;padding:8px 14px;border-radius:99px;background:var(--bg2);font-weight:800;font-size:.85rem;white-space:nowrap}.adm-nav button.on{background:var(--pri);color:var(--onpri)}
.adm h3{margin:18px 0 6px;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:1.5rem;font-family:var(--fd);color:var(--pri)}.stat small{color:var(--mut)}
.reg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin:8px 0}
.reg header{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.pa{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pa button,.pa label{padding:6px 11px;border-radius:10px;background:var(--bg2);font-weight:700;font-size:.8rem}.pa .del{color:var(--danger)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:800;background:var(--bg2)}
.pill.activo,.pill.ok{background:var(--ok);color:#fff}.pill.pendiente{background:var(--pri);color:var(--onpri)}.pill.expulsado,.pill.err{background:var(--danger);color:#fff}
.note{color:var(--mut);font-size:.88rem;margin:4px 0}
.info{background:color-mix(in srgb,var(--acc) 12%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:.9rem}
.alerta{background:color-mix(in srgb,var(--danger) 14%,var(--card));border:2px solid var(--danger);border-radius:12px;padding:9px 12px;margin:8px 0;font-weight:700}
.tema-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0 14px}
.tema-b{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:left;font-weight:700;font-size:.82rem}.tema-b.on{border-color:var(--pri)}
.tema-b i{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--line2)}.tema-b i s{flex:1}
.color-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips-sel button{padding:6px 12px;border-radius:99px;border:2px solid var(--line);font-weight:700;font-size:.82rem;background:var(--card)}.chips-sel button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.pfi{position:relative;display:inline-block;margin:4px}.pfi img{width:76px;height:76px;object-fit:cover;border-radius:12px;border:2px solid var(--line)}.pfi button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--danger);color:#fff;font-size:.7rem}
.foot{text-align:center;color:var(--mut);font-size:.82rem;padding:24px 16px 10px;position:relative}
#secret{position:absolute;right:6px;bottom:2px;width:42px;height:42px;opacity:.07;border-radius:12px}#secret:hover,#secret:focus-visible{opacity:.7}
/* arranque, mantenimiento y avisos */
.boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;text-align:center;padding:26px;background:radial-gradient(120% 90% at 20% 0,#fff3d6,#fdf0d5 55%,#f7dfae);color:#3b2f2f}
.boot h1{font-size:clamp(2.2rem,10vw,3.2rem);background:linear-gradient(90deg,#c98a1b,#3b82c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.boot svg{width:96px;height:96px;margin:0 auto 10px;animation:float 3s ease-in-out infinite;display:block}
.boot p{margin:8px 0}.boot .btn{margin-top:14px}
.mant{position:fixed;inset:0;z-index:250;background:var(--bg);display:grid;place-items:center;text-align:center;padding:28px;overflow:auto}
.mant .me{font-size:4rem}.mant h1{margin:8px 0}.mant p{color:var(--mut);white-space:pre-line;max-width:30em;margin:auto}
#secret2{position:fixed;right:8px;bottom:8px;width:44px;height:44px;border-radius:12px;opacity:.07}
.mantbar{position:fixed;left:0;right:0;top:64px;z-index:55;background:var(--danger);color:#fff;font-weight:700;text-align:center;padding:6px 10px;font-size:.85rem}
.mantbar button{margin-left:8px;background:rgba(255,255,255,.25);border-radius:8px;padding:3px 10px;font-weight:800;color:#fff}
.bub{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;max-width:min(340px,calc(100vw - 28px));touch-action:none;cursor:grab;animation:float 4s ease-in-out infinite}
.bub.drag{animation:none;cursor:grabbing}
.nx{position:fixed;top:70px;right:12px;z-index:58;display:grid;gap:10px;width:min(340px,calc(100vw - 24px));max-height:calc(100dvh - 170px);overflow:auto;pointer-events:none;justify-items:end}
.nx>*{pointer-events:auto;animation:nxin .4s cubic-bezier(.2,1.2,.4,1)}@keyframes nxin{from{transform:translateX(40px);opacity:0}}
.bm{position:relative;max-width:min(340px,calc(100vw - 28px));padding:14px 40px 14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.3);overflow-wrap:anywhere}
.bm .bx{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.25);color:inherit;font-size:.8rem}
.bm-t{font-weight:800;margin-bottom:4px}.bm-p{white-space:pre-line;font-weight:600}
.bm.s{font-size:.85rem}.bm.m{font-size:1rem}.bm.l{font-size:1.25rem}
.bm-img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px;cursor:zoom-in}
.bm audio{display:block;width:100%;margin-top:8px;height:40px}
.bm-link{margin-top:10px;background:rgba(0,0,0,.2);color:inherit;border:2px solid currentColor;display:inline-flex;padding:6px 12px;border-radius:11px;font-weight:800;text-decoration:none;font-size:.85rem}
.bm.f-bocadillo{border-radius:22px 22px 6px 22px}.bm.f-redonda{border-radius:26px}.bm.f-cuadrada{border-radius:4px}
.bm.f-pildora{border-radius:999px;padding:16px 44px 16px 26px;text-align:center}

  return `<div class="bm f-${f} ${t}" style="background:${hexOk(m.color) || '#c98a1b'};color:${hexOk(m.txt) || '#ffffff'}${fu ? ';font-family:' + esc(fu) : ''}">${extra}${m.titulo ? `<div class="bm-t">${esc(m.titulo)}</div>` : ''}${m.texto ? `<p class="bm-p">${esc(m.texto)}</p>` : ''}${m.img ? `<img class="bm-img" src="${esc(m.img)}" data-act="zoom" alt="Imagen del aviso">` : ''}${m.audio ? `<audio controls preload="none" src="${esc(m.audio)}"></audio>` : ''}${m.enlace ? `<a class="bm-link" href="${esc(safeUrl(m.enlace))}" target="_blank" rel="noopener">${esc(m.enlaceTxt || 'Abrir enlace')} ↗</a>` : ''}</div>`;
}
let NPOS = jget('cf_nota_pos', null), NXD = jget('cf_nx', []);
function posNota() {
  const el = $('#bub'); if (!NPOS) { el.style.left = el.style.top = el.style.right = el.style.bottom = ''; return; }
  el.style.left = Math.min(Math.max(0, NPOS.x * innerWidth), Math.max(0, innerWidth - el.offsetWidth)) + 'px'; el.style.top = Math.min(Math.max(0, NPOS.y * innerHeight), Math.max(0, innerHeight - el.offsetHeight)) + 'px'; el.style.right = el.style.bottom = 'auto';
}
function renderNota() {
  const n = CONF.nota, el = $('#bub');
  if (!(n.activa && hayMsg(n)) || localStorage.getItem('cf_nota') === n.id || mantActiva()) { el.hidden = true; el.dataset.sig = ''; el.innerHTML = ''; return; }
  el.hidden = false; const sig = JSON.stringify(n);
  if (el.dataset.sig !== sig) { el.dataset.sig = sig; el.innerHTML = burbuja(n, '<button class="bx" data-act="nota-x" aria-label="Quitar aviso">✕</button>'); }
  posNota();
}
(function () {
  const el = $('#bub'); let sx = 0, sy = 0, ox = 0, oy = 0, on = false, pid = null;
  el.addEventListener('pointerdown', e => { if (e.target.closest('button,a,audio,img')) return; const r = el.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; on = false; pid = e.pointerId; try { el.setPointerCapture(pid); } catch { } });
  el.addEventListener('pointermove', e => { if (pid !== e.pointerId) return; const dx = e.clientX - sx, dy = e.clientY - sy; if (!on && Math.hypot(dx, dy) < 6) return; on = true; el.classList.add('drag'); el.style.left = Math.min(Math.max(0, ox + dx), Math.max(0, innerWidth - el.offsetWidth)) + 'px'; el.style.top = Math.min(Math.max(0, oy + dy), Math.max(0, innerHeight - el.offsetHeight)) + 'px'; el.style.right = el.style.bottom = 'auto'; });
  const fin = e => { if (pid !== e.pointerId) return; pid = null; el.classList.remove('drag'); if (on) { NPOS = { x: (parseFloat(el.style.left) || 0) / innerWidth, y: (parseFloat(el.style.top) || 0) / innerHeight }; localStorage.setItem('cf_nota_pos', JSON.stringify(NPOS)); } on = false; };
  el.addEventListener('pointerup', fin); el.addEventListener('pointercancel', fin);
  addEventListener('resize', () => { if (!el.hidden) posNota(); });
})();
function renderNx() {
  const box = $('#nx'), L = mantActiva() ? [] : (CONF.notifs || []).filter(n => n.activa && hayMsg(n) && !NXD.includes(n.id));
  const sig = JSON.stringify(L); if (box.dataset.sig === sig) return; box.dataset.sig = sig;
  box.innerHTML = L.map(n => burbuja(n, `<button class="bx" data-act="nx-x" data-id="${esc(n.id)}" aria-label="Quitar">✕</button>`)).join('');
}

async function hacerRegistro(btn) {

async function chatCargar() {

   <div class="fld"><span>Imagen (opcional)</span><div id="${p}-imgbox"></div><label class="btn sm ghost fileb">🖼 Elegir imagen<input type="file" id="${p}-imgf" accept="image/*"></label></div>

   <div class="row2"><label class="fld"><span>Enlace (opcional)</span><input id="${p}-url" value="${g('enlace')}" placeholder="https://…"></label><label class="fld"><span>Texto del botón</span><input id="${p}-urlt" value="${g('enlaceTxt')}" placeholder="Abrir enlace"></label></div>
   <div class="fld"><span>Así se verá</span><div class="bm-prev" id="${p}-prev"></div></div>`;
}
function msgLeer(p) { const v = i => { const e = $('#' + p + '-' + i); return e ? e.value.trim() : ''; }, d = MSGD[p] || {}; return { titulo: v('tit'), texto: v('txt'), color: v('col'), txt: v('tcol'), tam: v('tam') || 'm', fuente: v('fue'), forma: v('for') || 'bocadillo', img: d.img || '', audio: d.audio || '', enlace: v('url'), enlaceTxt: v('urlt') }; }
function msgPrev(p) { const b = $('#' + p + '-prev'); if (b) b.innerHTML = burbuja(msgLeer(p)); }
function msgMediosUI(p) {
  const d = MSGD[p], ib = $('#' + p + '-imgbox'), ab = $('#' + p + '-audbox'); if (!d || !ib) return;
  ib.innerHTML = d.img ? `<span class="pfi"><img src="${esc(d.img)}" alt=""><button type="button" data-act="msg-quitar" data-p="${p}" data-k="img">✕</button></span>` : '<span class="note">Sin imagen.</span>';
  ab.innerHTML = d.audio ? `<audio controls src="${esc(d.audio)}" style="width:100%"></audio><button type="button" class="btn sm danger" data-act="msg-quitar" data-p="${p}" data-k="audio" style="margin-top:6px">Quitar audio</button>` : '<span class="note">Sin nota de voz.</span>';

async function msgPublicar(p) { const m = msgLeer(p); if (!hayMsg(m)) throw new Error('Escribe un mensaje, o agrega imagen, audio o enlace'); m.img = await subirMedio(m.img, 'imagenes'); m.audio = await subirMedio(m.audio, 'audio'); MSGD[p].img = m.img; MSGD[p].audio = m.audio; return m; }
async function grabar(p, btn) {
  const d = MSGD[p]; if (!d) return; if (d.grab) { d.grab.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast('Este navegador no puede grabar aquí. Usa «Subir audio».', 'err');
  let s; try { s = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch { return toast('Permite el micrófono para grabar', 'err'); }
  const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(s, mt ? { mimeType: mt } : undefined), parts = [], t0 = Date.now(); let iv;
  rec.ondataavailable = e => { if (e.data.size) parts.push(e.data); };
  rec.onstop = () => { clearInterval(iv); s.getTracks().forEach(t => t.stop()); d.grab = null; const b = $('#' + p + '-rec'); if (b) b.textContent = '🎙 Grabar'; const fr = new FileReader(); fr.onload = () => { d.audio = String(fr.result); msgMediosUI(p); }; fr.readAsDataURL(new Blob(parts, { type: rec.mimeType || mt || 'audio/webm' })); };
  d.grab = rec; rec.start(); btn.textContent = '⏹ Parar (0:00)';
  iv = setInterval(() => { const sec = Math.floor((Date.now() - t0) / 1000), b = $('#' + p + '-rec'); if (b) b.textContent = `⏹ Parar (${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')})`; if (sec >= 60 && rec.state === 'recording') rec.stop(); }, 500);
}
const extDe = m => ({ 'audio/webm': 'webm', 'audio/mp4': 'm4a', 'audio/mpeg': 'mp3', 'audio/ogg': 'ogg', 'audio/wav': 'wav', 'image/jpeg': 'jpg', 'image/png': 'png' })[String(m).split(';')[0]] || 'bin';
async function subirMedio(du, carpeta, lim = 300000) {
  if (!/^data:/.test(du || '')) return du || '';
  const g = ghInfo();
  if (g.u && g.r && g.token) { try { const path = carpeta + '/' + uid() + '.' + extDe(du.slice(5, du.indexOf(';'))); await gh('PUT', path, { message: 'Subir archivo', content: du.split(',')[1] }); return path; } catch (e) { if (du.length > lim) throw e; } }
  if (du.length <= lim) return du; throw new Error('El archivo es muy grande. Configura GitHub (pestaña GitHub) o usa uno más pequeño.');
}

/* ---------- GitHub: actualizar la página y conexión ---------- */
function ghInfo() {
  const s = jget('tem_conn', {}); let u = s.user || CFG.GH_USER, r = s.repo || CFG.GH_REPO, b = s.branch || CFG.GH_BRANCH || 'main';
  if (!u && location.hostname.endsWith('.github.io')) { u = location.hostname.split('.')[0]; r = location.pathname.split('/')[1] || (u + '.github.io'); }
  return { u, r, b, token: localStorage.getItem('tem_gh_token') || '' };
}
async function gh(method, path, body) {
  const g = ghInfo(); if (!g.u || !g.r) throw new Error('Falta el usuario o el repositorio de GitHub (pestaña GitHub)'); if (!g.token) throw new Error('Falta el token de GitHub (pestaña GitHub)');
  const url = `https://api.github.com/repos/${g.u}/${g.r}/contents/${path}` + (method === 'GET' ? `?ref=${encodeURIComponent(g.b)}&t=${Date.now()}` : '');
  const r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json' }, body: body ? JSON.stringify({ ...body, branch: g.b }) : undefined });
  if (r.status === 404 && method === 'GET') return null;
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch { } throw new Error('GitHub: ' + (m || r.status)); }
  return r.json();
}
